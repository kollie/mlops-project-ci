name: mlops
channels:
  - conda-forge
  - defaults
dependencies:
  # Python base
  - python=3.8
  
  # Core ML libraries
  - pandas=2.0.3
  - numpy=1.24.3
  - scikit-learn=1.3.0
  - scipy=1.10.1
  
  # MLflow and experiment tracking
  - mlflow=2.10.2
  
  # Configuration management
  - pyyaml=6.0.2
  - python-dotenv=0.21.0
  - hydra-core=1.3.2
  - omegaconf=2.3.0
  
  # Visualization
  - matplotlib=3.7.2
  - seaborn=0.13.2
  
  # Testing
  - pytest=8.3.5
  - pytest-cov=5.0.0
  - pytest-mock
  
  # Data processing and utilities
  - joblib=1.4.2
  
  # Additional dependencies from pip
  - pip
  - pip:
    # MLflow dependencies
    - databricks-sdk==0.33.0
    - cloudpickle==3.0.0
    
    # Hydra dependencies
    - antlr4-python3-runtime==4.9.3
    
    # Additional utilities
    - requests==2.32.3
    - click==8.1.7
    
    # Optional: DVC for data versioning
    - dvc[gdrive]
